apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-config-operator
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  project: default
  source:
    repoURL: https://redhat-cop.github.io/vault-config-operator
    chart: vault-config-operator
    targetRevision: "v0.8.51"
    helm:
      releaseName: vault-config-operator
      values: |
        # cert-manager (wave 0) issues the webhook/metrics certs on vanilla k8s.
        enableCertManager: true
        # Chart default renders a Prometheus ServiceMonitor; athens has no
        # prometheus-operator, so the missing CRD blocks the ENTIRE sync
        # ("one or more synchronization tasks are not valid"). Off until an
        # observability stack exists.
        enableMonitoring: false
  destination: { server: https://kubernetes.default.svc, namespace: vault-config-operator }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
