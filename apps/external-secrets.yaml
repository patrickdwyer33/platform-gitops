apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "2.8.0"
    helm:
      releaseName: external-secrets
  destination: { server: https://kubernetes.default.svc, namespace: external-secrets }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # ServerSideApply: the SecretStore/ClusterSecretStore CRDs embed every
    # provider's schema and exceed the 262144-byte last-applied-configuration
    # annotation that client-side apply writes — SSA doesn't write it at all.
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
