# KV v2 secrets engine mounted at `secret/` (path defaults to metadata.name).
# Holds static app secrets: secret/todo/dev, secret/todo/prod, ...
apiVersion: redhatcop.redhat.io/v1alpha1
kind: SecretEngineMount
metadata:
  name: secret
spec:
  authentication:
    path: kubernetes
    role: vault-admin
    serviceAccount: { name: vault-admin }
  connection: { address: "http://vault.vault.svc:8200" }
  type: kv
  options:
    version: "2"
  config:
    # The operator's defaulter materializes spec.config with an empty
    # listingVisibility, which then fails the CRD's enum ("unauth"|"hidden") —
    # so it must be set explicitly. "hidden" is Vault's normal default.
    listingVisibility: hidden
