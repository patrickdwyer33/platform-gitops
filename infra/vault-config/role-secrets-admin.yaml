# Lets the operator (a human with kubectl) mint a short-lived secrets-write
# token with no standing credential anywhere:
#   TOKEN=$(kubectl create token vault-admin -n vault-admin --duration=10m)
#   kubectl -n vault exec -i vault-0 -- vault write -field=token \
#     auth/kubernetes/login role=secrets-admin jwt="$TOKEN"
# Bound to the same vault-admin SA the config operator uses — anyone who can
# mint that SA's tokens already holds cluster-admin on this cluster.
apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: secrets-admin
spec:
  authentication:
    path: kubernetes
    role: vault-admin
    serviceAccount: { name: vault-admin }
  connection: { address: "http://vault.vault.svc:8200" }
  path: kubernetes
  policies: [secrets-write]
  targetServiceAccounts: [vault-admin]
  targetNamespaces:
    targetNamespaces: [vault-admin]
  tokenTTL: 900
