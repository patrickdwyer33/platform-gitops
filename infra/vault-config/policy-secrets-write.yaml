# The human write-path for secret VALUES (seeding, rotation). No standing
# token carries this policy — one is minted ad hoc via the secrets-admin role
# (role-secrets-admin.yaml). ESO stays read-only; the config operator's own
# policy has no secret/* access at all.
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: secrets-write
spec:
  authentication:
    path: kubernetes
    role: vault-admin
    serviceAccount: { name: vault-admin }
  connection: { address: "http://vault.vault.svc:8200" }
  type: acl
  policy: |
    path "secret/data/*" {
      capabilities = ["create", "read", "update", "delete"]
    }
    path "secret/metadata/*" {
      capabilities = ["read", "list", "delete"]
    }
