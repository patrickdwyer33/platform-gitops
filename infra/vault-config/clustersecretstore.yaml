# ESO's handle on Vault (cluster-scoped). ExternalSecrets in workload overlays
# reference this store; ESO logs in via the k8s-auth role `eso` (role-eso.yaml)
# and materializes Vault paths as ordinary k8s Secrets. When Vault is down the
# already-synced Secrets simply persist — that's the availability story.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
