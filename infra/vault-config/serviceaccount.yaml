# The identity the vault-config-operator uses when talking to Vault: every CR
# below says "authenticate as THIS ServiceAccount via the k8s auth role
# `vault-admin`". That Vault role + its admin policy are the one-time manual
# bootstrap grant (`./vault-bootstrap grant`, run with the root token) — the
# hand-cranked first turn, after which everything is reconciled from here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-admin
