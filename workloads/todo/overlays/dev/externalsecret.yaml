# todo-secrets is no longer hand-applied: ESO materializes it from Vault
# (secret/todo/dev). Rotation = write new values to Vault; same consequences as
# before (session secret logs everyone out, VAPID kills push subscriptions).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: todo-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: todo-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: todo/dev
