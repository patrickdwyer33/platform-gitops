apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
# NO nameSuffix: the ServiceAccount must stay named `todo` so its IRSA token
# subject is system:serviceaccount:dev:todo, matching the todo-objects role
# trust policy. (Same rule as draw's overlay.)
resources:
  - ../../base
  - ingress.yaml
patches:
  - target: { kind: Deployment, name: todo }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: OBJECTS_BUCKET, value: objects-dev.patrickdwyer.com }
images:
  - name: todo
    newName: 048751351548.dkr.ecr.us-east-2.amazonaws.com/todo
    newTag: "92139fd"
