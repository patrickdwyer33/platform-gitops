# www.patrickdwyer.com exists only to send callers to the bare apex. It needs a
# real router, a real backend and its own certificate anyway: a browser
# completes the TLS handshake before it can be told to go somewhere else, so an
# uncertificated redirect host fails with a warning instead of redirecting.
#
# The regex deliberately does not exclude /.well-known/acme-challenge/. The
# solver Ingress cert-manager creates carries an exact-path rule, which outranks
# this router's prefix match, so challenges are served rather than redirected.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-to-apex
spec:
  redirectRegex:
    regex: '^https?://www\.patrickdwyer\.com/(.*)'
    replacement: 'https://patrickdwyer.com/${1}'
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: patrickdwyer-com-www
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: prod-www-to-apex@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [www.patrickdwyer.com]
      secretName: patrickdwyer-com-www-tls
  rules:
    - host: www.patrickdwyer.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: patrickdwyer-com
                port: { number: 80 }
