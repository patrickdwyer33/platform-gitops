# ============================================================================
# patrickdwyer.com is a zone apex. No CNAME is legal at an apex, so this host
# reaches the cluster only through Cloudflare's CNAME flattening, and the
# record must stay DNS-only (grey) -- proxying breaks cert-manager's HTTP-01
# challenge.
#
# If this host is ever re-pointed, move DNS FIRST and let it resolve before the
# Argo Application exists. An Application whose host resolves elsewhere retries
# a challenge that can never pass, against the ACME account every ingress in
# this repo shares. The AWS VPC resolver also negative-caches NXDOMAIN for up
# to the SOA minimum (1800s), so a host that never existed stalls issuance far
# longer than one that merely changed.
# ============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
  - ingress.yaml
  - www-redirect.yaml
images:
  - name: patrickdwyer-com
    newName: 048751351548.dkr.ecr.us-east-2.amazonaws.com/patrickdwyer-com
    newTag: "3cd1f76"
